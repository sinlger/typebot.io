# ==========================================
# 1. 主域名 qinglbot.com / www.qinglbot.com → landing-page-v0（Nginx 静态托管）
#    注意：landing-page-v0 是纯静态 SPA，由 Nginx 直读 dist，不再反代 PM2。
#    参考 ECS_DEPLOY.md §4.5。
# ==========================================
server {
    listen 80;
    server_name qinglbot.com www.qinglbot.com;
    return 301 https://qinglbot.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name qinglbot.com www.qinglbot.com;

    ssl_certificate /etc/qinglbot/qinglbot.com.pem;
    ssl_certificate_key /etc/qinglbot/qinglbot.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /opt/typebot-landing-v0/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ==========================================
# 2. builder.qinglbot.com → 3000
# ==========================================
server {
    listen 80;
    server_name builder.qinglbot.com;
    return 301 https://builder.qinglbot.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name builder.qinglbot.com;

    ssl_certificate /etc/qinglbot/qinglbot.com.pem;
    ssl_certificate_key /etc/qinglbot/qinglbot.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==========================================
# 3. viewer.qinglbot.com → 3001
# ==========================================
server {
    listen 80;
    server_name viewer.qinglbot.com;
    return 301 https://viewer.qinglbot.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name viewer.qinglbot.com;

    ssl_certificate /etc/qinglbot/qinglbot.com.pem;
    ssl_certificate_key /etc/qinglbot/qinglbot.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式聊天响应
        proxy_buffering off;
    }
}

# ==========================================
# 4. partykit.qinglbot.com → 1999 (WebSocket)
# 注意：当前证书只覆盖 qinglbot.com / www.qinglbot.com，
# partykit/builder/viewer 子域名 HTTPS 访问浏览器会提示证书无效，
# 后续请补充通配证书或多域名证书。
# ==========================================
server {
    listen 80;
    server_name partykit.qinglbot.com;
    return 301 https://partykit.qinglbot.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name partykit.qinglbot.com;

    ssl_certificate /etc/qinglbot/qinglbot.com.pem;
    ssl_certificate_key /etc/qinglbot/qinglbot.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://127.0.0.1:1999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 必需
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
